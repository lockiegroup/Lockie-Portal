<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!--
      Gradient sampled directly from the brand logo:
      upper-left: #b4c8dc (light steel blue)
      lower-right: #7066ae (blue-purple)
    -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse"
                    x1="50" y1="50" x2="450" y2="450">
      <stop offset="0%"   stop-color="#b4c8dc"/>
      <stop offset="45%"  stop-color="#9eb4da"/>
      <stop offset="100%" stop-color="#7066ae"/>
    </linearGradient>
  </defs>

  <!-- Solid dark-navy background — no transparency, no anti-alias bleed -->
  <rect width="500" height="500" fill="#0f172a"/>

  <!--
    L shape path (all integers, clockwise outer boundary):

    Vertical bar  : x = 55 → 191  (width 136, ~34 % of 400 span — matches logo)
    Horizontal bar: y = 336 → 450 (height 114, ~28 % of 400 span — matches logo)
    Padding       : 55 px each side

    Top cap          — semicircle r=68 (half bar width), dome peaks at y=55
    Outer BL corner  — r=50, rounds the bottom-left outer corner
    Inner corner     — r=68, concave notch where bars meet
    Right end        — flat, matching the logo
  -->
  <path shape-rendering="geometricPrecision" d="
    M 191,123
    A 68,68 0 0,0 55,123
    L 55,400
    A 50,50 0 0,0 105,450
    L 450,450
    L 450,336
    L 259,336
    A 68,68 0 0,0 191,268
    Z
  " fill="url(#g)"/>
</svg>
